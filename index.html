<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1a26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Outremer — prototype</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ece6d6'/><path d='M6 2h4v4h4v4h-4v4H6v-4H2V6h4z' fill='%23b8141c'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="title">OUTREMER <span>prototype</span></div>
      <div id="order" aria-label="Turn order"></div>
    </header>
    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="banner" class="hidden"></div>
    </main>
    <section id="panel">
      <div id="info"></div>
      <div id="hint"></div>
      <div id="actions"></div>
    </section>
    <div id="overlay" class="hidden">
      <div class="card">
        <h1 id="ov-title"></h1>
        <p id="ov-text"></p>
        <button id="restart" class="btn primary">Play again</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
