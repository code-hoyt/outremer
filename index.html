<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1a26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Outremer — prototype</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ece6d6'/><path d='M6 2h4v4h4v4h-4v4H6v-4H2V6h4z' fill='%23b8141c'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="title">OUTREMER <span>prototype</span></div>
      <div id="order" aria-label="Turn order"></div>
    </header>
    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="banner" class="hidden"></div>
      <div id="pv" class="hidden"></div>
      <div id="facing-tip" class="hidden">Choose facing</div>
      <div id="cmd" class="hidden"></div>
      <!-- title / Victory / Defeat: a map picker that works like the command menu (pad up/down + A, or tap) -->
      <div id="overlay" class="hidden">
        <div class="card">
          <h1 id="ov-title"></h1>
          <p id="ov-text"></p>
          <div id="ov-list"></div>
        </div>
      </div>
    </main>
    <section id="panel">
      <div id="info"></div>
      <div id="hint"></div>
      <div id="pad">
        <!-- context-aware d-pad: one fixed footprint, three layers that cross-fade (see controls.pad* in config) -->
        <div id="dpad" class="off" data-mode="off" aria-label="D-pad">
          <div class="lay lay-map on" aria-label="move cursor">
            <button data-dir="3" class="q nw" aria-label="cursor up-left (west)">◤</button>
            <button data-dir="0" class="q ne" aria-label="cursor up-right (north)">◥</button>
            <button data-dir="2" class="q sw" aria-label="cursor down-left (south)">◣</button>
            <button data-dir="1" class="q se" aria-label="cursor down-right (east)">◢</button>
            <div class="hub"></div>
          </div>
          <div class="lay lay-menu" aria-label="menu up/down">
            <button data-step="-1" class="v up" aria-label="menu up">▲</button>
            <button data-step="1" class="v down" aria-label="menu down">▼</button>
          </div>
          <div class="lay lay-face" aria-label="choose facing">
            <button data-face="3" class="q nw" aria-label="face up-left (west)">⬉</button>
            <button data-face="0" class="q ne" aria-label="face up-right (north)">⬈</button>
            <button data-face="2" class="q sw" aria-label="face down-left (south)">⬋</button>
            <button data-face="1" class="q se" aria-label="face down-right (east)">⬊</button>
            <div class="hub">✠</div>
          </div>
        </div>
        <div id="ab">
          <button id="btnB" class="round b" aria-label="B (back)">B</button>
          <button id="btnA" class="round a" aria-label="A (confirm)">A</button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
