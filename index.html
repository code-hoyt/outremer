<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1a26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Outremer — prototype</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ece6d6'/><path d='M6 2h4v4h4v4h-4v4H6v-4H2V6h4z' fill='%23b8141c'/></svg>" />
  <link rel="stylesheet" href="style.css?v=0.14.0" />
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="title">OUTREMER <span>prototype</span></div>
      <div id="order" aria-label="Turn order"></div>
    </header>
    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="banner" class="hidden"></div>
      <div id="pv" class="hidden"></div>
      <div id="facing-tip" class="hidden">Choose facing</div>
      <div id="cmd" class="hidden"></div>
      <!-- title / Victory / Defeat: a map picker that works like the command menu (pad up/down + A, or tap) -->
      <div id="overlay" class="hidden">
        <div class="card">
          <h1 id="ov-title"></h1>
          <p id="ov-text"></p>
          <div id="ov-list"></div>
        </div>
      </div>
    </main>
    <section id="panel">
      <div id="info"></div>
      <div id="hint"></div>
      <div id="pad">
        <!-- context-aware d-pad: one fixed footprint, three layers that cross-fade (see controls.pad* in config) -->
        <div id="dpad" class="off" data-mode="off" aria-label="D-pad">
          <div class="lay lay-map on" aria-label="move cursor">
            <!-- classic cross; which iso direction each arm moves is CONFIG.controls.padCross (main.js sets data-dir) -->
            <button data-arm="up" class="arm u" aria-label="cursor up (up-right on the map)">▲</button>
            <button data-arm="right" class="arm r" aria-label="cursor right (down-right on the map)">▶</button>
            <button data-arm="down" class="arm d" aria-label="cursor down (down-left on the map)">▼</button>
            <button data-arm="left" class="arm l" aria-label="cursor left (up-left on the map)">◀</button>
            <div class="hub"></div>
          </div>
          <div class="lay lay-menu" aria-label="menu up/down">
            <button data-step="-1" class="v up" aria-label="menu up">▲</button>
            <button data-step="1" class="v down" aria-label="menu down">▼</button>
          </div>
          <div class="lay lay-face" aria-label="choose facing">
            <button data-arm="up" class="arm u" aria-label="face up (up-right on the map)">▲</button>
            <button data-arm="right" class="arm r" aria-label="face right (down-right on the map)">▶</button>
            <button data-arm="down" class="arm d" aria-label="face down (down-left on the map)">▼</button>
            <button data-arm="left" class="arm l" aria-label="face left (up-left on the map)">◀</button>
            <div class="hub">✠</div>
          </div>
        </div>
        <div id="ab">
          <button id="btnB" class="round b" aria-label="B (back)">B</button>
          <button id="btnA" class="round a" aria-label="A (confirm)">A</button>
        </div>
      </div>
    </section>
    <!-- character creation wizard (src/create.js): full screen, touch-first; no battle pad here -->
    <div id="create" class="hidden" aria-label="Create your hero"></div>
  </div>
  <script type="module" src="src/main.js?v=0.14.0"></script>
</body>
</html>
