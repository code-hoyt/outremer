<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script><script src="pad.js"></script>
<style>
.hdr { display: flex; gap: 10px; margin-top: 4px; }
.por { width: 118px; height: 150px; border: 2px solid #d8c48f; border-radius: 8px; overflow: hidden; position: relative; flex: 0 0 auto; }
.por .nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; background: rgba(10,9,14,.8); font-size: 12px; padding: 2px 6px; color: #d8c48f; }
.side { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.field { border: 1px solid #4b3f4f; border-radius: 8px; padding: 5px 8px; background: rgba(18,15,24,.7); }
.field .lbl { font: 10px system-ui, sans-serif; color: #8d816c; letter-spacing: 1px; text-transform: uppercase; }
.field .val { font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.field .val i { font-style: normal; color: #d8c48f; font-size: 13px; }
.mv { font: 11px system-ui, sans-serif; color: #c9bea6; } .mv b { color: #fff; }
.sheet { margin-top: 10px; border: 2px solid #d8c48f; border-radius: 10px; background: rgba(18,15,24,.93); padding: 4px; }
.row { display: grid; grid-template-columns: 44px 1fr 30px 34px 30px 58px; align-items: center; height: 46px; border-radius: 7px; border: 1px solid transparent; padding: 0 4px; position: relative; }
.row.sel { background: #3a3024; border-color: #d8c48f; }
.row.sel::before { content: '▶'; position: absolute; left: -2px; color: #ffd85a; font-size: 10px; }
.row .ab2 { color: #d8c48f; font-size: 13px; letter-spacing: 1px; padding-left: 8px; }
.row .nm { font-size: 15px; } .row .nm small { display: block; font: 10px system-ui, sans-serif; color: #8d816c; }
.pm { width: 28px; height: 28px; border-radius: 7px; border: 1px solid #6a5a46; background: #2a2430; display: flex; align-items: center; justify-content: center; font: bold 16px system-ui; color: #d8c48f; }
.pm.off { color: #4f4636; border-color: #3a3236; }
.num { text-align: center; font-size: 20px; font-weight: bold; }
.num.hi { color: #5fd36a; } .num.lo { color: #e8a04a; }
.der { text-align: right; font: 11px system-ui, sans-serif; color: #c9bea6; } .der b { color: #fff; font-size: 12px; }
.pool { display: flex; justify-content: space-between; padding: 6px 10px 4px; font-size: 14px; border-top: 1px solid #4b3f4f; margin-top: 4px; }
.pool b { font-size: 18px; }
.btns { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.2fr; gap: 6px; margin-top: 8px; }
.btns .btn { height: 42px; font-size: 14px; }
.btns .btn small { font: 9px system-ui; color: #8d816c; margin-left: 4px; }
.derived { margin-top: 8px; font: 11px system-ui, sans-serif; color: #c9bea6; display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: center; } .derived b { color: #fff; }
</style></head><body><div class="phone">
<div class="top"><div class="title">OUTREMER <span>Create your hero · mockup A: roll sheet</span></div></div>
<div class="body">
  <div class="hdr">
    <div class="por"><script>document.write(bust('knight'))</script><span class="ph-tag" style="top:4px;left:4px">PLACEHOLDER</span><div class="nav"><span>◀</span><span>3 / 8</span><span>▶</span></div></div>
    <div class="side">
      <div class="field"><div class="lbl">Name</div><div class="val">Brother Aimery <i>✎</i></div></div>
      <div class="field"><div class="lbl">Class</div><div class="val">Knight <i>◀ ▶</i></div><div class="mv">MOV <b>3</b> · JMP <b>1</b> · Rng 1 · Heavy: sand/rock slow</div></div>
      <div class="field" style="padding:4px 8px"><div class="lbl">Background</div><div class="mv" style="font-size:12px">Fixed for every hero (story TBD)</div></div>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="btns"><div class="btn primary">Reroll</div><div class="btn">Store</div><div class="btn">Recall<small>74</small></div><div class="btn">Done ▸</div></div>
  <div class="derived">In battle → HP <b>51</b> ATK <b>17</b> DEF <b>11</b> SPD <b>6</b> MOV <b>3</b> JMP <b>1</b> Hit <b>+2%</b> Resist <b>+10%</b></div>
</div>
<script>
const der = { MGT: 'ATK <b>17</b>', END: 'HP <b>51</b>', FOR: 'DEF <b>11</b>', AGI: 'SPD <b>6</b>', AIM: 'Hit <b>+2%</b>', RES: 'Res <b>+10%</b>' };
const floor = { AGI: 9 };
document.getElementById('sheet').innerHTML = STATS.map(([k, n, f], i) => { const v = ROLL[k];
  return `<div class="row ${i === 0 ? 'sel' : ''}"><span class="ab2">${k}</span><span class="nm">${n}<small>→ ${f}</small></span>
  <span class="pm ${floor[k] ? 'off' : ''}">−</span><span class="num ${v >= 15 ? 'hi' : v <= 9 ? 'lo' : ''}">${v}</span><span class="pm">+</span><span class="der">${der[k]}</span></div>`; }).join('')
  + `<div class="pool"><span>Points to spend <b class="gold">2</b></span><span class="muted">Total <b style="color:#efe7d4">76</b> · each 3–18</span></div>`;
document.write(panel({ hint: '▲▼ stat · ◀▶ take/give a point · A on Reroll rolls again', held: 'r', a: 'select', b: 'back' }));
</script>
</div></body></html>
