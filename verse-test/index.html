<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100c0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Outremer — scripture burn test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23100c0a'/><path d='M7 1h2v5h5v2H9v7H7V8H2V6h5z' fill='%23c5a35a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" data-mode="title">
    <div id="stage" aria-live="polite">
      <div id="map" aria-hidden="true">
        <div class="node n1"></div>
        <div class="node n2 consecrated"></div>
        <div class="node n3"></div>
        <div class="node n4"></div>
        <div class="node n5"></div>
      </div>

      <div id="frame">
        <div class="filigree top" aria-hidden="true">
          <span class="rule"></span>
          <span class="cross">✠</span>
          <span class="rule"></span>
        </div>

        <p id="kicker"></p>
        <h1 id="act-title"></h1>

        <div id="card">
          <p id="reference"></p>
          <div id="verse-well">
            <p id="english" class="verse"></p>
            <p id="latin" class="verse" aria-hidden="true"></p>
            <canvas id="embers" aria-hidden="true"></canvas>
          </div>
        </div>

        <div class="filigree bot" aria-hidden="true">
          <span class="rule"></span>
          <span class="cross">✠</span>
          <span class="rule"></span>
        </div>
      </div>
    </div>

    <footer id="chrome">
      <div class="chrome-row modes" role="tablist" aria-label="Presentation mode">
        <button type="button" id="btn-title" class="mode on" role="tab" aria-selected="true">Title card</button>
        <button type="button" id="btn-toast" class="mode" role="tab" aria-selected="false">Toast</button>
      </div>
      <div class="chrome-row actions">
        <button type="button" id="btn-prev" class="act" aria-label="Previous verse">←</button>
        <button type="button" id="btn-replay" class="act wide">Replay</button>
        <button type="button" id="btn-next" class="act" aria-label="Next verse">→</button>
      </div>
      <label class="speed">
        <span id="speed-label">Speed</span>
        <input type="range" id="speed" min="50" max="200" step="10" value="100" aria-valuetext="1 times" />
        <span id="speed-vals"></span>
      </label>
    </footer>
  </div>
  <script src="verse.js"></script>
</body>
</html>
